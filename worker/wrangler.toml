# BLADE Fleet Ops event worker. Deploy from this folder with: wrangler deploy
name = "blade-fleet-events"
main = "src/worker.js"
compatibility_date = "2026-09-01"
account_id = "d1be322958802f1805183230bd6e0c28"

[vars]
SLACK_CHANNEL_ID = "C0C2YS9G7PB"   # #blade-fleet-tracker: the bot reads this channel for plain-text commands
WX_CHANNEL_ID = "C0C4LR2L4RM"                 # flight-category channel: set after /wx/setup?channel=<name> returns its ID

[observability]
enabled = true          # Workers Logs (paid plan): persistent logs in the Cloudflare dashboard

[triggers]
crons = ["* * * * *"]   # every minute; each run samples three times (0s, 20s, 40s)

[[kv_namespaces]]
binding = "KV"
id = "b82367d937d340be8dc5233db18872f2"

# Secret, set once and never committed:  wrangler secret put SLACK_WEBHOOK

[[services]]
binding = "GC"
service = "blade-ground-connect"   # Ground Connect worker; its /sweep is kicked from this cron (secret GC_KEY)
